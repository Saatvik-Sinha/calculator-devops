name: calculator-devops

services:
  calculator-app:
    image: ${DOCKER_REPO:-calculator-devops}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calculator-app
    environment:
      PORT: "8080"
    # Reachable only from other containers on calc-net (NOT published to the host),
    # so it cannot clash with Jenkins or anything else already using host port 8080.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - calc-net
    restart: unless-stopped

  nginx-proxy:
    image: nginx:1.27-alpine
    container_name: nginx-proxy
    ports:
      # Host port defaults to 8081; set NGINX_HOST_PORT=80 to serve on port 80.
      - "${NGINX_HOST_PORT:-8081}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - calc-net
    restart: unless-stopped

networks:
  calc-net:
    name: calc-net
    driver: bridge

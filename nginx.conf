# Mounted into the nginx container as /etc/nginx/conf.d/default.conf,
# so this file only contains the upstream and server blocks (http context).

upstream calculator_backend {
    # "calculator-app" is resolved through Docker's internal DNS on the calc-net network
    server calculator-app:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location / {
        proxy_pass http://calculator_backend;

        # Required for upstream keep-alive connections
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
